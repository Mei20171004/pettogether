<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdf5ea" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="PetTogether 宠物照顾习惯调研，匿名填写，约 6 分钟。"
    />
    <title>PetTogether 宠物照顾习惯调研</title>
    <link rel="stylesheet" href="/styles.css?v=20260909-225750" />
    <script type="module" src="/app.js?v=20260909-225750"></script>
  </head>
  <body>
    <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18" />
        <path d="M12 3a13.5 13.5 0 0 1 0 18a13.5 13.5 0 0 1 0-18" />
      </symbol>
      <symbol id="i-paw" viewBox="0 0 24 24">
        <ellipse cx="8" cy="6.9" rx="1.9" ry="2.4" />
        <ellipse cx="16" cy="6.9" rx="1.9" ry="2.4" />
        <ellipse cx="4.3" cy="12.4" rx="1.8" ry="2.2" />
        <ellipse cx="19.7" cy="12.4" rx="1.8" ry="2.2" />
        <path d="M12 12.6c3 0 5.4 2.4 5.4 5 0 1.7-1.3 2.8-3 2.8-1 0-1.7-.4-2.4-.4s-1.4.4-2.4.4c-1.7 0-3-1.1-3-2.8 0-2.6 2.4-5 5.4-5z" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7.6v5.2" />
        <path d="M12 16.6h.01" />
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="M12 3.6l2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z" />
      </symbol>
      <symbol id="i-card" viewBox="0 0 24 24">
        <rect x="2.6" y="5" width="18.8" height="14" rx="2.6" />
        <path d="M2.6 10h18.8" />
        <path d="M6.4 14.6h3.4" />
      </symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6v.4h5.4v-.4c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z" />
        <path d="M9.4 18.6h5.2" />
        <path d="M10.4 21h3.2" />
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <rect x="2.6" y="5" width="18.8" height="14" rx="2.6" />
        <path d="M3.6 7.7l7.1 5a2.2 2.2 0 0 0 2.6 0l7.1-5" />
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24">
        <path d="M4.5 12h14" />
        <path d="M12.8 6.2l5.8 5.8-5.8 5.8" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.6l4.6 4.6L19 6.8" />
      </symbol>
    </svg>

    <div class="page-shell">
      <header class="brand-bar" aria-label="PetTogether">
        <a class="brand" href="/" aria-label="PetTogether 问卷首页">
          <span class="brand-mark" aria-hidden="true"><svg class="icon brand-icon" aria-hidden="true" focusable="false"><use href="#i-paw" /></svg></span>
          <span>PetTogether</span>
        </a>
      </header>

      <main>
        <section class="survey-card" aria-labelledby="survey-title">
          <div class="survey-head">
            <h1 id="survey-title" data-i18n="宠物照顾习惯调研">宠物照顾习惯调研</h1>
            <p class="survey-note" data-i18n="本问卷约需 6 分钟，匿名填写，答案仅用于产品研究与统计分析。">本问卷约需 6 分钟，匿名填写，答案仅用于产品研究与统计分析。</p>
            <ul class="survey-meta">
              <li data-i18n="约 6 分钟">约 6 分钟</li>
              <li data-i18n="共 7 部分">共 7 部分</li>
              <li data-i18n="无需注册">无需注册</li>
            </ul>
          </div>

          <div class="progress-header">
            <span class="step-icon" aria-hidden="true"><svg class="icon" id="step-icon" aria-hidden="true" focusable="false"><use href="#i-globe" /></svg></span>
            <h2 id="step-title">基本信息</h2>
          </div>
          <ol class="progress-segments" id="progress-segments" aria-hidden="true">
            <li><span></span></li><li><span></span></li><li><span></span></li>
            <li><span></span></li><li><span></span></li><li><span></span></li>
            <li><span></span></li>
          </ol>

          <form id="survey-form" novalidate>
            <section class="form-step is-active" data-step="0" data-theme="sky" data-title="基本信息" data-icon="globe">
              <div id="language-question"></div>
              <fieldset class="question" data-required-group>
                <legend><span class="q-code">E1</span> <span data-i18n="你在哪个国家/地区？">你在哪个国家/地区？</span></legend>
                <div class="choice-grid compact" id="country-options"></div>
                <p class="field-error" data-i18n="请选择一个国家或地区。">请选择一个国家或地区。</p>
              </fieldset>
            </section>

            <section class="form-step" data-step="1" data-theme="honey" data-title="养宠背景" data-icon="paw">
              <div id="background-questions"></div>
              <aside class="skip-note" id="skip-note" hidden>
                <span data-i18n="本问卷主要面向养宠人群，以下仅剩一个选填问题。">本问卷主要面向养宠人群，以下仅剩一个选填问题。</span>
              </aside>
            </section>

            <section class="form-step" data-step="2" data-theme="coral" data-title="日常困扰" data-icon="alert" data-pet-owner-step>
              <fieldset class="question" data-required-group data-min="1">
                <legend><span class="q-code">A2</span> <span data-i18n="下面哪些情况发生过？">下面哪些情况发生过？</span></legend>
                <div class="choice-list" id="pain-options"></div>
                <p class="field-error" data-i18n="请至少选择一项。">请至少选择一项。</p>
              </fieldset>
            </section>

            <section class="form-step" data-step="3" data-theme="clay" data-title="功能重要性" data-icon="star" data-pet-owner-step>
              <div class="rating-list" id="feature-ratings"></div>
            </section>

            <section class="form-step" data-step="4" data-theme="olive" data-title="订阅与价格" data-icon="card" data-pet-owner-step>
              <div id="payment-questions"></div>
            </section>

            <section class="form-step" data-step="5" data-theme="wisteria" data-title="其他需求" data-icon="bulb" data-pet-owner-step>
              <div id="missing-questions"></div>
            </section>

            <section class="form-step" data-step="6" data-theme="sage" data-title="联系方式" data-icon="mail">
              <label class="question text-question" for="q_email">
                <span class="question-label"><span class="q-code">E3</span> <span data-i18n="如需接收内测邀请，可以留下邮箱（选填）">如需接收内测邀请，可以留下邮箱（选填）</span></span>
                <input
                  id="q_email"
                  name="q_email"
                  type="email"
                  inputmode="email"
                  autocomplete="email"
                  maxlength="254"
                  placeholder="you@example.com（选填）" data-i18n-placeholder="you@example.com（选填）"
                />
                <span class="field-help" data-i18n="仅用于发送 PetTogether 内测邀请。">仅用于发送 PetTogether 内测邀请。</span>
              </label>
              <label class="consent-row">
                <input type="checkbox" id="consent" required />
                <span data-i18n="我同意将本问卷答案用于匿名产品研究和统计分析。">我同意将本问卷答案用于匿名产品研究和统计分析。</span>
              </label>
              <p class="field-error consent-error" id="consent-error" data-i18n="提交前请确认同意。">提交前请确认同意。</p>
            </section>

            <div class="form-message" id="form-message" role="alert" hidden></div>

            <div class="form-actions">
              <button class="button secondary" id="back-button" type="button" hidden><span data-i18n="返回">返回</span></button>
              <button class="button primary" id="next-button" type="button">
                <span data-i18n="下一步">下一步</span> <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-right" /></svg>
              </button>
              <button class="button primary" id="submit-button" type="submit" hidden disabled>
                <span data-i18n="提交问卷">提交问卷</span> <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check" /></svg>
              </button>
            </div>
          </form>

          <section class="success-state" id="success-state" hidden aria-labelledby="success-title">
            <div class="success-icon" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check" /></svg></div>
            <h2 id="success-title" data-i18n="提交成功">提交成功</h2>
            <p data-i18n="感谢参与，你的答案已记录。">感谢参与，你的答案已记录。</p>
          </section>
        </section>
      </main>

      <footer>
        <span>© 2026 PetTogether</span>
        <span data-i18n="问卷匿名收集 · 仅用于产品研究">问卷匿名收集 · 仅用于产品研究</span>
      </footer>
    </div>
  </body>
</html>
